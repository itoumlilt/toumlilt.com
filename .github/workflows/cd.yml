name: CD2VPS-toumlilt.com

on:
  push:
    branches: [ master ]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Download static artifact
        uses: actions/download-artifact@v4
        with:
          name: toumlilt-com-dist
          path: dist
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_PORT: ${{ secrets.REMOTE_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/toumlilt-com-deploy
          chmod 600 ~/.ssh/toumlilt-com-deploy
          ssh-keyscan -p "${REMOTE_PORT:-22}" "$REMOTE_HOST" >> ~/.ssh/known_hosts
      - name: Deploy on VPS
        env:
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_PORT: ${{ secrets.REMOTE_PORT }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
        run: |
          tar -C dist -czf - . | ssh -i ~/.ssh/toumlilt-com-deploy \
            -p "${REMOTE_PORT:-22}" \
            "$REMOTE_USER@$REMOTE_HOST"
