name: CI-toumlilt.com

on:
  push:
  pull_request:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI_NPM_VERSION: 10.9.0
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pin npm
        run: npm install -g "npm@${CI_NPM_VERSION}"
      - name: Show toolchain
        run: |
          node --version
          npm --version
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Upload static artifact
        uses: actions/upload-artifact@v4
        with:
          name: toumlilt-com-dist
          path: dist
