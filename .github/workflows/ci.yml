name: CI-toumlilt.com

on:
  push:
  pull_request:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Show toolchain
        run: |
          node --version
          npm --version
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Print npm debug logs
        if: failure()
        run: |
          for log in "$HOME"/.npm/_logs/*debug*.log; do
            [ -e "$log" ] || continue
            echo "::group::$log"
            sed -n '1,260p' "$log"
            echo "::endgroup::"
          done
      - name: Upload npm debug logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npm-debug-logs
          path: ~/.npm/_logs
          if-no-files-found: ignore
      - name: Check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Upload static artifact
        uses: actions/upload-artifact@v4
        with:
          name: toumlilt-com-dist
          path: dist
