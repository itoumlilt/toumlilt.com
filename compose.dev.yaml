# Local development only. Start explicitly with -f to keep Caddy previews separate.
name: toumlilt-com-dev

services:
  site:
    # Same multi-architecture Node 22 image on ARM64 and AMD64 Macs.
    image: node:22-bookworm
    init: true
    working_dir: /app
    ports:
      - "127.0.0.1:4321:4321"
    environment:
      ASTRO_TELEMETRY_DISABLED: "1"
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      # Polling also detects editor changes through the macOS VM's shared files.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - astro_cache:/app/.astro
      - npm_cache:/root/.npm
    command:
      - sh
      - -c
      - npm ci --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 4321

volumes:
  node_modules:
  astro_cache:
  npm_cache:
